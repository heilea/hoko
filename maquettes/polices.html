/* Comparateur de polices : cinq paires libres d'usage commercial, aperçu avec le contenu réel de Hoko */
:root {
  --bg: #FFFFFF; --sunken: #F8F4F7; --ink: #2B1B28; --muted: #6E5C6B; --border: #E6DCE4;
  --mauve: #60435c; --framboise: #df015e; --orange: #ff521b; --soleil: #fdc149;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/24px system-ui, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 48px; }
main { max-width: 1152px; margin: 0 auto; display: grid; gap: 24px; }
h1 { margin: 0; font: 700 28px/34px system-ui, sans-serif; }
p { margin: 0; max-width: 65ch; }
.muted { color: var(--muted); }
.grille { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.choix { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 16px; align-content: start; min-width: 0;
  border: 1px solid var(--border); border-radius: 12px; padding: 16px; background: var(--bg); }
.choix:hover { border-color: var(--mauve); }
.choix:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.choix[aria-pressed="true"] { border-color: var(--framboise); box-shadow: inset 0 0 0 2px var(--framboise); }
.entete { display: flex; align-items: start; justify-content: space-between; gap: 12px; font-family: system-ui, sans-serif; }
.noms { display: grid; gap: 4px; min-width: 0; }
.noms strong { font-size: 17px; line-height: 22px; }
.desc { font-size: 14px; line-height: 20px; color: var(--muted); }
.coche { visibility: hidden; flex: none; background: var(--framboise); color: #fff; font: 600 12px/16px system-ui, sans-serif; padding: 4px 10px; border-radius: 999px; }
.choix[aria-pressed="true"] .coche { visibility: visible; }
.apercu { display: grid; gap: 12px; background: var(--sunken); border-radius: 8px; padding: 16px; font-family: var(--b), system-ui, sans-serif; }
.logo { font: var(--dw) 28px/32px var(--d), system-ui, sans-serif; color: var(--orange); }
.logo span { color: var(--framboise); }
.titre { font: var(--dw) 34px/1.1 var(--d), system-ui, sans-serif; overflow-wrap: anywhere; }
.texte { font: 400 16px/24px var(--b), system-ui, sans-serif; }
.annonce { display: grid; gap: 2px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
.a-titre { font: 700 17px/22px var(--b), system-ui, sans-serif; }
.prix { font: 700 18px/24px var(--b), system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.lieu { font: 400 14px/20px var(--b), system-ui, sans-serif; color: var(--muted); }
.boutons { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { background: var(--framboise); color: #fff; border-radius: 8px; padding: 10px 18px; font: 700 16px/24px var(--b), system-ui, sans-serif; }
.btn.sec { background: transparent; color: var(--ink); border: 1px solid var(--border); }
.resume { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; border-radius: 8px; padding: 12px 16px; font-weight: 600; }
</style>
